    event-type: Event Type
    action: Action
    subject-type: Subject Type
    subject-id: Subject ID
    performed-by: Performed By
    reason: Reason
    comments: Comments
    meta: Event Data
    date: Date
    scheduled-at: Scheduled At
    completed-at: Completed At
  event-types:
    stock_adjustment: Stock Adjustment
