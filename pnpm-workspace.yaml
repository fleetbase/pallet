# pnpm <10 rejects a workspace file without `packages`, which broke any
# `pnpm run` invoked by an older pnpm ("packages field missing or empty")
packages:
  - '.'

allowBuilds:
  '@fortawesome/fontawesome-common-types': false
  '@fortawesome/fontawesome-svg-core': false
  '@fortawesome/free-brands-svg-icons': false
  '@fortawesome/free-solid-svg-icons': false
  core-js: false
  fsevents: false
minimumReleaseAge: 0
